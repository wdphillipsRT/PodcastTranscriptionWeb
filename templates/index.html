{% extends "base.html" %}
{% block title %}Request · Private media workspace{% endblock %}
{% block content %}
<h1>Private media workspace</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
{% if current_user.is_authenticated %}<p><a href="{{ url_for('workspace.dashboard') }}">Return to dashboard</a></p>
{% else %}<p><a href="{{ url_for('auth.login') }}">Administrator login</a></p>{% endif %}
{% endblock %}
