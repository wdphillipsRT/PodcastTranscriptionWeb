<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() if config.WTF_CSRF_ENABLED else '' }}">
  <title>{% block title %}Private media workspace{% endblock %}</title>
  <style>
    :root { color-scheme: light; font: 17px/1.6 system-ui, sans-serif; color: #1b2930; background: #f4f6f5; }
    body { margin: 0; } header, main { max-width: 70rem; margin: auto; padding: 1.25rem; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; border-bottom: 1px solid #b6c5c1; }
    nav { display: flex; align-items: center; gap: 1rem; } a { color: #075a53; }
    h1, h2, h3 { line-height: 1.25; } section, article, fieldset { margin: 1.5rem 0; }
    article, fieldset { border: 1px solid #b6c5c1; padding: 1rem; border-radius: .35rem; background: #fff; }
    label { display: block; margin: .65rem 0; } input, select, button { font: inherit; padding: .5rem; max-width: 100%; box-sizing: border-box; }
    input[type=url], input[type=email], input[type=password] { width: min(100%, 40rem); }
    button { cursor: pointer; border: 1px solid #075a53; border-radius: .25rem; background: #075a53; color: white; }
    :focus-visible { outline: 3px solid #c27600; outline-offset: 3px; }
    table { border-collapse: collapse; width: 100%; } th, td { text-align: left; border-bottom: 1px solid #b6c5c1; padding: .65rem; }
    .table-scroll { overflow-x: auto; } .notice, [role=alert] { border-left: 4px solid #957000; padding: .75rem; background: #fff9e5; }
    dt { font-weight: 650; } dd { margin: 0 0 .75rem; overflow-wrap: anywhere; } pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
    .skip { position: absolute; top: -6rem; } .skip:focus { top: 0; background: white; padding: .5rem; }
    small { display: block; } [hidden] { display: none !important; }
  </style>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <span>Private media workspace</span>
    {% if current_user.is_authenticated %}
    <nav aria-label="Main navigation">
      <a href="{{ url_for('workspace.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('workspace.classification_review') }}">Classification reviews ({{ classification_review_depth }})</a>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if config.WTF_CSRF_ENABLED else '' }}">
        <button type="submit">Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main id="main" tabindex="-1">
    {% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
