# The user-managed Cloudflare Tunnel connects to the host's loopback port.
x-app: &app
  build: .
  image: podcast-transcription:local
  env_file: [.env]
  init: true
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-podcasts}
      POSTGRES_USER: ${POSTGRES_USER:-podcasts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *app
    restart: "no"
    entrypoint: []
    command: [flask, --app, "app:create_app", db, upgrade]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *app
    entrypoint: [/app/scripts/start-web.sh]
    command: [gunicorn, --bind, "0.0.0.0:8005", --workers, "2", --timeout, "120", "app:create_app()"]
    ports: ["127.0.0.1:8005:8005"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 75s

  worker:
    <<: *app
    entrypoint: [/app/scripts/start-worker.sh]
    command: [celery, -A, tasks.celery_app, worker, --loglevel=info, --queues, "default,discovery,downloads,transcription", --concurrency, "2"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1770

  beat:
    <<: *app
    entrypoint: [/app/scripts/start-beat.sh]
    command: [celery, -A, tasks.celery_app, beat, --loglevel=info, --schedule, /tmp/celerybeat-schedule, --pidfile, /tmp/celerybeat.pid]

  classifier:
    <<: *app
    entrypoint: [/app/scripts/start-classifier.sh]
    command: [celery, -A, tasks.celery_app, worker, --loglevel=info, --queues, classification, --concurrency, "1", --hostname, "classifier@%h"]
    # Celery's warm shutdown finishes the running block before stop or up -d cuts it off.
    stop_grace_period: 60s
    # Platform Model Router client bundle (client.crt, client.key, router-ca.crt,
    # token, token.expires_at), read-only; only the classifier holds it.
    volumes:
      - type: bind
        source: ${ROUTER_CREDENTIALS_HOST_PATH:-./.runtime/router}
        target: /router
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=1770

  # Optional: start with COMPOSE_PROFILES=knowledge once the Platform intake
  # spool exists. It mounts only the podcast inbox and joins its group.
  exporter:
    <<: *app
    profiles: [knowledge]
    entrypoint: [/app/scripts/start-exporter.sh]
    command: [celery, -A, tasks.celery_app, worker, --loglevel=info, --queues, knowledge, --concurrency, "1", --hostname, "exporter@%h"]
    environment:
      KNOWLEDGE_EXPORT_INBOX: /spool/podcast/inbox
    group_add: ["${PODCAST_INTAKE_GID:-65534}"]
    volumes:
      - type: bind
        source: ${PODCAST_INTAKE_INBOX_HOST_PATH:-/srv/bezalel/intake/podcast/inbox}
        target: /spool/podcast/inbox
        bind:
          create_host_path: false

volumes:
  postgres_data:

# Pinned: the Platform firewall admits only this subnet to the model router
# (bezalel-deploy platform_router_podcast_client_cidrs). Changing it recreates
# the network and needs a matching firewall change.
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.144.0/20
          gateway: 192.168.144.1
